openapi: 3.0.3
info:
  title: dPagès API v1
  version: '1.0'
  description: >
    API interna del sistema de gestión de comandas de dPagès. Fuente única de
    verdad del contrato entre backend y frontend — ver también
    docs/contrato-api.md para las explicaciones de negocio detrás de cada
    regla (por qué el empaquetado exige valores obligatorios, qué es
    kgEditable, etc.).

    Refleja el estado confirmado hasta la capa 11 (detalle de incidencias,
    CORS, alta manual de cliente, dirección de entrega del pedido, fecha y
    observación por línea, código de tarifa) MÁS las decisiones funcionales
    confirmadas con el cliente el 18/08/2026: campos de agrupación de
    artículo (formato, envasado, agrupación de producción), agrupación de
    rendimiento por categoría, Rendiments Porcs, Panell Producció (shape
    cerrado; las fórmulas numéricas todavía no — ver
    docs/contrato-api.md sección 4.10), Panell Obrador por línea individual
    (ya no agrupado por producto), orígenes de pedido como tabla mantenible
    (ya no un enum fijo), y usuarios/roles. Los endpoints que en su momento
    eran sólo contrato (rendiments-porcs, panells/produccio, usuaris, rols,
    jo, origens-comanda) ya están implementados en el backend real, cada
    uno con su suite de tests.
  contact:
    name: VisioFlow Tech

servers:
  - url: http://localhost:8080
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: Salut
  - name: Categories
  - name: Productes
  - name: RendimentsPorcs
  - name: Tarifes
  - name: Clients
  - name: Transportistes
  - name: Comandes
  - name: OrigensComanda
  - name: Empaquetat
  - name: Panells
  - name: Usuaris
  - name: Rols

paths:
  /salut:
    get:
      tags: [Salut]
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estat: { type: string, example: ok }
                  versio: { type: string, example: '0.1.0' }
                  baseDades: { type: string, example: ok }

  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Listar categorías de artículo
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Categoria' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Categories]
      summary: Crear una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/categories/{id}:
    patch:
      tags: [Categories]
      summary: Actualizar una categoría (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaEntrada' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Categories]
      summary: >-
        Eliminar una categoría. Borrado protegido: si CUALQUIER artículo
        todavía la usa — activo o inactivo, sin distinción (capa 27) —
        responde 409 con el recuento en vez de dejar artículos con una
        referencia rota.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/productes:
    get:
      tags: [Productes]
      summary: Listar artículos del catálogo
      parameters:
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: tipus
          in: query
          schema: { type: string, enum: [simple, variable] }
        - name: actiu
          in: query
          schema: { type: boolean }
        - name: cerca
          in: query
          schema: { type: string }
        - name: agrupacioProduccio
          in: query
          description: >-
            Coincidencia exacta (case-insensitive, capa 45) — regla 3.1
            transversal del proyecto, no substring. No confundir con
            cerca, que sí es substring.
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Producte' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Productes]
      summary: Crear un artículo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducteEntrada' }
      responses:
        '201':
          description: Artículo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/productes/{id}:
    get:
      tags: [Productes]
      summary: Obtener un artículo
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Artículo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    patch:
      tags: [Productes]
      summary: Actualizar un artículo (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducteEntrada' }
      responses:
        '200':
          description: Artículo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producte' }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/rendiments-porcs:
    get:
      tags: [RendimentsPorcs]
      summary: >-
        Listar fichas de rendimiento porcino. Nuevo, confirmado 18/08/2026.
        Sólo devuelve fichas cuyo producto pertenece a una categoría con
        agrupacioRendiment definido (ver descripción del schema RendimentPorc).
      parameters:
        - name: agrupacioRendiment
          in: query
          schema: { type: string, enum: [KG, MAGRE, PAQ] }
        - name: categoria
          in: query
          schema: { type: string }
        - name: agrupacioProduccio
          in: query
          description: >-
            Coincidencia exacta (case-insensitive, capa 45) — regla 3.1
            transversal del proyecto, no substring.
          schema: { type: string }
        - name: producte
          in: query
          description: >-
            Filtra por descripció del producte, coincidencia exacta
            (case-insensitive) — regla 3.1 transversal del proyecto, no
            substring.
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/RendimentPorc' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [RendimentsPorcs]
      summary: Crear una ficha de rendimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RendimentPorcEntrada' }
      responses:
        '201':
          description: Ficha creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendimentPorc' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/rendiments-porcs/{id}:
    patch:
      tags: [RendimentsPorcs]
      summary: >-
        Actualizar una ficha de rendimiento (parcial, edición en línea).
        producteId no se edita una vez creada la fila.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unitatsPerPorc: { type: string, example: '2.00' }
                kgPerUnitat: { type: string, example: '3.500' }
      responses:
        '200':
          description: Ficha actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RendimentPorc' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [RendimentsPorcs]
      summary: Eliminar una ficha de rendimiento
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/tarifes/matriu:
    get:
      tags: [Tarifes]
      summary: Matriz de precios (tarifa × artículo)
      parameters:
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: cerca
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Matriz paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  tarifes:
                    type: array
                    items: { $ref: '#/components/schemas/TarifaResum' }
                  dades:
                    type: array
                    items:
                      type: object
                      properties:
                        producteId: { type: integer }
                        codi: { type: string }
                        descripcio: { type: string }
                        preus:
                          type: object
                          additionalProperties:
                            type: string
                            nullable: true
                          example: { '1': '9.86', '2': null }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/tarifes:
    post:
      tags: [Tarifes]
      summary: Crear una tarifa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TarifaEntrada' }
      responses:
        '201':
          description: Tarifa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TarifaResum' }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/tarifes/{tarifaId}/preus/{producteId}:
    patch:
      tags: [Tarifes]
      summary: Actualizar el precio de un artículo en una tarifa (edición de celda)
      parameters:
        - name: tarifaId
          in: path
          required: true
          schema: { type: integer }
        - name: producteId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preu]
              properties:
                preu: { type: string, example: '9.50' }
      responses:
        '200':
          description: Precio actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  tarifaId: { type: integer }
                  producteId: { type: integer }
                  preu: { type: string }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Tarifes]
      summary: >-
        Capa 28. Vuelve la celda a "sin precio" — el PATCH de arriba nunca
        acepta null/vacío, así que este es el único camino de vuelta. Borra
        la fila de tarifa_preu; la cascada de resolución de precio de línea
        cae sola al precio de catálogo del producto.
      parameters:
        - name: tarifaId
          in: path
          required: true
          schema: { type: integer }
        - name: producteId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204':
          description: Precio eliminado — la celda vuelve a null en la matriz
        '404':
          description: >-
            tarifaId/producteId no existen, o esa celda nunca tuvo precio
            cargado (mismo criterio que el resto de los DELETE del
            sistema — no es idempotente-204).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Listar clientes
      parameters:
        - name: cerca
          in: query
          schema: { type: string }
        - name: tarifaId
          in: query
          schema: { type: integer }
        - name: actiu
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Clients]
      summary: >
        Alta manual de cliente. Necesario cuando un pedido entra por
        teléfono/WhatsApp/email de alguien que todavía no existe en el
        sistema. codi NO se manda acá — se autogenera siempre (capa 29,
        mismo mecanismo que el sync de WooCommerce desde la capa 25).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientEntrada' }
      responses:
        '201':
          description: Cliente creado, con codi ya autogenerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '400': { $ref: '#/components/responses/Validacio' }
        '409':
          description: >-
            Defensa en profundidad: colisión de codi autogenerado (no
            debería poder pasar con id_seq único, ver capa 29).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/clients/{id}:
    patch:
      tags: [Clients]
      summary: >-
        Actualizar un cliente (parcial) — asignar tarifa o transportista
        por defecto. codi no es editable (capa 29, sólo lectura para
        siempre) — si se manda, se ignora sin error.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tarifaId: { type: integer, nullable: true }
                transportistaDefecteId: { type: integer, nullable: true }
      responses:
        '200':
          description: Cliente actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/transportistes:
    get:
      tags: [Transportistes]
      summary: Listar transportistas
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Transportista' }
    post:
      tags: [Transportistes]
      summary: Crear un transportista
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportistaEntrada' }
      responses:
        '201':
          description: Transportista creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transportista' }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/transportistes/{id}:
    patch:
      tags: [Transportistes]
      summary: Actualizar un transportista (parcial)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportistaEntrada' }
      responses:
        '200':
          description: Transportista actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transportista' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes:
    get:
      tags: [Comandes]
      summary: Listar pedidos
      parameters:
        - name: estat
          in: query
          schema: { $ref: '#/components/schemas/EstatComanda' }
        - name: clientId
          in: query
          schema: { type: integer }
        - name: origen
          in: query
          description: 'Codi de origen_comanda, ej. "woocommerce" o "manual" — ya no es un enum fijo.'
          schema: { type: string }
        - name: dataDes
          in: query
          description: Filtra por dataComanda (comanda.creat_en) — sin cambios.
          schema: { type: string, format: date }
        - name: dataFins
          in: query
          description: >-
            Filtra por dataComanda (comanda.creat_en) — sin cambios de
            criterio de comparación. Capa 36: incluye el día completo (hasta
            las 23:59:59.999 de esa fecha), no sólo su medianoche inicial.
          schema: { type: string, format: date }
        - name: dataProduccioDes
          in: query
          description: >-
            Capa 21. Matchea si AL MENOS UNA línea del pedido tiene
            dataProduccio dentro del rango (la misma línea cumple
            dataProduccioDes Y dataProduccioFins a la vez, no dos líneas
            distintas cumpliendo cada una un extremo).
          schema: { type: string, format: date }
        - name: dataProduccioFins
          in: query
          description: >-
            Ver dataProduccioDes. Capa 36: incluye el día completo, igual
            que el resto de los "...Fins" del proyecto.
          schema: { type: string, format: date }
        - name: dataLliuramentDes
          in: query
          description: Capa 21. Filtra por comanda.dataLliurament (cabecera).
          schema: { type: string, format: date }
        - name: dataLliuramentFins
          in: query
          description: >-
            Ver dataLliuramentDes. Capa 36: incluye el día completo, igual
            que el resto de los "...Fins" del proyecto.
          schema: { type: string, format: date }
        - name: cerca
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/ComandaResum' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Comandes]
      summary: Alta manual de pedido (teléfono, email, WhatsApp)
      description: >-
        Capa 34: linies[].dataProduccio (si viene) se valida contra las 6
        reglas de coherencia temporal (ver ComandaEntradaParcial.
        dataProduccio) — en este endpoint, como dataProduccio/dataExpedicio
        de cabecera no son campos de este body, en la práctica sólo puede
        dispararse la regla 5 (línea vs. dataLliurament).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComandaEntrada' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/comandes/{id}:
    get:
      tags: [Comandes]
      summary: Detalle de un pedido, con líneas e incidencias
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    patch:
      tags: [Comandes]
      summary: Actualizar cabecera del pedido (parcial)
      description: >-
        Capa 31. Incluye `estat`: transición libre entre los 6 valores de
        EstatComanda, sin máquina de estados. Si `estat` es "amb_incidencia",
        `detall` es obligatorio en el mismo body (400 si falta) y se registra
        como una incidencia nueva (tipus "manual"). Capa 34: si cambia
        alguna fecha de cabecera, se valida contra las 6 reglas de
        coherencia temporal (ver ComandaEntradaParcial.dataProduccio),
        incluyendo TODAS las líneas activas del pedido, no sólo las que este
        request esté tocando (no toca ninguna). 409 si la comanda está
        congelada.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComandaEntradaParcial' }
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies:
    post:
      tags: [Comandes]
      summary: >-
        Capa 30. Agregar una línea a un pedido YA creado — hasta esta capa
        la única forma de corregir un pedido existente era borrarlo entero
        y recargarlo de cero, perdiendo el número de pedido original.
      description: >-
        El precio se resuelve con la MISMA cascada que POST /comandes
        (tarifa del cliente → precio de catálogo → "0.00" + incidencia).
        Si la línea queda sin precio resuelto, se registra la incidencia
        sense_preu y el pedido pasa a amb_incidencia si no lo estaba ya.
        Capa 34: si dataProduccio viene, se valida contra las 6 reglas de
        coherencia temporal (ver ComandaEntradaParcial.dataProduccio) usando
        las fechas de cabecera ya guardadas del pedido. 409 si la comanda
        está congelada.
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiniaEntrada' }
      responses:
        '201':
          description: Línea agregada — devuelve la comanda completa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies/{liniaId}:
    patch:
      tags: [Comandes]
      summary: Capa 30. Editar una línea existente (cuerpo parcial).
      description: >-
        NUNCA re-resuelve preuUnitari — sólo recalcula totalLinia
        (preuUnitari sin tocar × unitatsDemanades nuevo, si vino). Si hace
        falta re-resolver precio a propósito es una acción separada,
        todavía no existe un endpoint para eso. kgDemanats sólo se acepta
        si el artículo es "a medida" (kgEditable true en esa línea) —
        rechaza con 400 si el artículo tiene ficha de peso (el peso se
        recalcula solo desde unitatsDemanades). Capa 34: si dataProduccio
        cambia, se valida contra las 6 reglas de coherencia temporal
        (ver ComandaEntradaParcial.dataProduccio) usando las fechas de
        cabecera ya guardadas del pedido. Capa 38: unitatsDemanades admite
        hasta 2 decimales (NUMERIC(10,2), entregas/pedidos parciales de
        pieza). 409 si la comanda está congelada.
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unitatsDemanades:
                  type: number
                  exclusiveMinimum: 0
                  multipleOf: 0.01
                  description: >-
                    Capa 38. JS number normal en la entrada, hasta 2
                    decimales (NUMERIC(10,2)) — más de 2 decimales rechaza
                    con 400 VALIDACIO.
                kgDemanats: { type: string }
                dataProduccio: { type: string, format: date-time, nullable: true }
                obsProduccio: { type: string, nullable: true }
      responses:
        '200':
          description: Línea actualizada — devuelve la comanda completa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComandaDetall' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }
    delete:
      tags: [Comandes]
      summary: Eliminar una línea de pedido
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Eliminada }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies/{liniaId}/lliurament:
    patch:
      tags: [Empaquetat]
      summary: >
        Registrar unidades y kilos entregados de una línea (panel de
        empaquetado). Ambos campos son obligatorios y no pueden ser cero —
        ver docs/contrato-api.md sección 5 para el motivo de negocio. Capa
        38: unitatsLliurades admite hasta 2 decimales en la entrada
        (NUMERIC(10,2), entrega parcial de pieza) y sale como string. Si el
        pedido está congelado, devuelve 409.
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitatsLliurades, kgLliurats]
              properties:
                unitatsLliurades:
                  type: number
                  exclusiveMinimum: 0
                  multipleOf: 0.01
                  description: Capa 38. JS number normal, hasta 2 decimales (NUMERIC(10,2)).
                kgLliurats: { type: string, example: '9.750' }
      responses:
        '200':
          description: Línea confirmada
          content:
            application/json:
              schema:
                type: object
                properties:
                  liniaId: { type: integer }
                  comandaId: { type: integer }
                  unitatsLliurades:
                    type: string
                    description: >-
                      Capa 38. BREAKING: string, no number (NUMERIC(10,2)) —
                      el body de entrada sigue siendo number, sólo cambió la
                      salida.
                  kgLliurats: { type: string }
                  confirmatA: { type: string, format: date-time }
                  confirmatPer:
                    type: object
                    properties:
                      id: { type: string }
                      nom: { type: string }
        '400': { $ref: '#/components/responses/Validacio' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/comandes/{comandaId}/linies/{liniaId}/treball:
    patch:
      tags: [Comandes]
      summary: >-
        Capa 40. Marcar/desmarcar una línea como trabajada (Panell Obrador).
      description: >-
        marcat=true fija treballatA a la hora del servidor y treballatPer al
        usuario autenticado; marcat=false desmarca, ambos vuelven a null. La
        respuesta siempre se relee de la base después de escribir, nunca
        ecoa el body (a diferencia del hallazgo de la capa 38 sobre
        unitatsLliurades en PATCH .../lliurament). 409 si la comanda está
        congelada, mismo criterio que el resto de endpoints de línea.
      parameters:
        - name: comandaId
          in: path
          required: true
          schema: { type: integer }
        - name: liniaId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marcat]
              properties:
                marcat: { type: boolean }
      responses:
        '200':
          description: Línea actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreballLiniaResposta' }
        '400': { $ref: '#/components/responses/Validacio' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/panells/oficina:
    get:
      tags: [Panells]
      summary: Panel de oficina (solo lectura, con subtotales sobre todo lo filtrado)
      description: >-
        Capa 35: bultos nuevo en la respuesta; obsProduccio pasó de string a
        boolean (ver FilaPanellOficina.obsProduccio); 4 filtros nuevos —
        tarifaId, poblacioDesti, dataComandaDes/Fins, dataLliuramentDes/Fins.
        Capa 36: los tres "...Fins" incluyen el día completo.
      parameters:
        - name: dataExpedicioDes
          in: query
          schema: { type: string, format: date }
        - name: dataExpedicioFins
          in: query
          description: Capa 36. Incluye el día completo (hasta las 23:59:59.999 de esa fecha).
          schema: { type: string, format: date }
        - name: dataComandaDes
          in: query
          description: Capa 35. Rango sobre dataComanda (comanda.creat_en).
          schema: { type: string, format: date }
        - name: dataComandaFins
          in: query
          description: >-
            Capa 35. Rango sobre dataComanda (comanda.creat_en). Capa 36:
            incluye el día completo.
          schema: { type: string, format: date }
        - name: dataLliuramentDes
          in: query
          description: Capa 35. Rango sobre dataLliurament.
          schema: { type: string, format: date }
        - name: dataLliuramentFins
          in: query
          description: >-
            Capa 35. Rango sobre dataLliurament. Capa 36: incluye el día
            completo.
          schema: { type: string, format: date }
        - name: transportistaId
          in: query
          schema: { type: integer }
        - name: tarifaId
          in: query
          description: Capa 35. Coincidencia exacta, mismo patrón que transportistaId/clientId.
          schema: { type: integer }
        - name: estat
          in: query
          schema: { $ref: '#/components/schemas/EstatComanda' }
        - name: clientId
          in: query
          schema: { type: integer }
        - name: poblacioDesti
          in: query
          description: >-
            Capa 35. Coincidencia EXACTA, case-insensitive (no substring) —
            regla 3.1 transversal.
          schema: { type: string }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      comandes: { type: integer }
                      linies: { type: integer }
                      totalKg: { type: string }
                      totalEur: { type: string }
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/FilaPanellOficina' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/panells/obrador:
    get:
      tags: [Panells]
      summary: >-
        Panel de obrador (solo lectura). Confirmado con el cliente el
        18/08/2026: líneas de pedido INDIVIDUALES, ya no agrupado por
        artículo.
      description: >-
        Orden por defecto (capa 46), no opcional: las líneas pendientes
        (treballatA null) salen siempre primero, sin ningún parámetro —
        necesario para que la paginación real no muestre una página con
        sólo líneas ya trabajadas. Dentro de cada grupo se mantiene el
        orden de siempre (dataProduccio, num, ordinal).
      parameters:
        - name: dataProduccioDes
          in: query
          schema: { type: string, format: date }
        - name: dataProduccioFins
          in: query
          description: Capa 36. Incluye el día completo (hasta las 23:59:59.999 de esa fecha).
          schema: { type: string, format: date }
        - name: categoriaId
          in: query
          schema: { type: integer }
        - name: tipus
          in: query
          schema: { type: string }
        - name: producte
          in: query
          description: >-
            Filtra por producte.descripcio — coincidencia EXACTA,
            case-insensitive (no substring). Capa 20, mismo criterio que
            GET /rendiments-porcs y GET /panells/produccio. Repetible
            (29/09/2026): varios valores = líneas de cualquiera de ellos.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: format
          in: query
          description: Filtra por producte.format — coincidencia exacta. Capa 20.
          schema: { type: string }
        - name: envasat
          in: query
          description: Filtra por producte.envasat — coincidencia exacta. Capa 20.
          schema: { type: string }
        - name: clientId
          in: query
          description: Tarea 25 (01/10/2026). Cliente del pedido.
          schema: { type: integer }
        - name: agrupacioProduccio
          in: query
          description: >-
            Tarea 28. Repetible, coincidencia exacta con
            producte.agrupacio_produccio; varios valores = cualquiera.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: observacions
          in: query
          description: >-
            Tarea 31. Con / sin observaciones de producción de la propia
            línea (las de cabecera no cuentan).
          schema: { type: string, enum: [si, 'no'] }
        - name: treball
          in: query
          description: Tarea 26. Líneas pendientes o ya trabajadas.
          schema: { type: string, enum: [pendents, fets] }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      linies: { type: integer }
                      totalUnitats:
                        type: string
                        description: >-
                          Capa 38. BREAKING: string, no number (SUM de
                          NUMERIC(10,2)).
                      totalKg: { type: string }
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/FilaPanellObrador' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/panells/produccio:
    get:
      tags: [Panells]
      summary: >-
        Panel de producción (solo lectura, capa 16) — calculadora de
        demanda vs. rendimiento porcino. Ver docs/contrato-api.md sección
        4.10 para las fórmulas y el ejemplo numérico verificado.
      parameters:
        - name: nombrePorcs
          in: query
          required: true
          description: >-
            Obligatorio — sin valor, o con 0/negativo, responde 400
            VALIDACIO. Es una calculadora interactiva: no hay default
            silencioso posible sin inducir a error.
          schema: { type: number }
        - name: agrupacioRendiment
          in: query
          schema: { type: string, enum: [KG, MAGRE, PAQ] }
        - name: producte
          in: query
          description: >-
            Filtra por descripció del producte, coincidencia exacta
            (case-insensitive) — mismo criterio que GET /rendiments-porcs.
          schema: { type: string }
        - name: dataDes
          in: query
          description: 'Default: mañana (hoy + 1 día).'
          schema: { type: string, format: date }
        - name: dataFins
          in: query
          description: >-
            Default: hoy + 7 días. Ya incluía el día completo antes de la
            capa 36 (compara sólo la fecha en ambos lados) — no tenía el bug
            sistémico que sí tenían los demás "...Fins" del proyecto.
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanellProduccio' }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/panells/obrador/marcar-fets:
    post:
      tags: [Panells]
      summary: Marcar como trabajadas todas las líneas pendientes filtradas (tarea 26)
      description: >-
        Acepta los mismos filtros que GET /panells/obrador (query string) y
        marca como trabajadas todas las líneas pendientes que los cumplen,
        no sólo una página. Las líneas de pedidos congelados se dejan igual
        y se cuentan en congeladesOmeses. Exige el mòdul panell-obrador.
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  marcades: { type: integer }
                  congeladesOmeses: { type: integer }
        '400': { $ref: '#/components/responses/Validacio' }

  /api/v1/panells/empaquetat:
    get:
      tags: [Panells]
      summary: Panel de empaquetado (única pantalla operativa con edición, vía /lliurament)
      description: >-
        Capa 37: 2 filtros nuevos — dataLliuramentDes/Fins y producte.
        Orden por defecto (capa 46), no opcional: mismo criterio que
        /panells/obrador — las líneas pendientes (confirmatA null) salen
        siempre primero, sin ningún parámetro. Dentro de cada grupo se
        mantiene el orden de siempre (dataExpedicio, num, ordinal).
      parameters:
        - name: dataExpedicioDes
          in: query
          schema: { type: string, format: date }
        - name: dataExpedicioFins
          in: query
          description: Capa 36. Incluye el día completo (hasta las 23:59:59.999 de esa fecha).
          schema: { type: string, format: date }
        - name: dataLliuramentDes
          in: query
          description: Capa 37. Rango sobre dataLliurament.
          schema: { type: string, format: date }
        - name: dataLliuramentFins
          in: query
          description: >-
            Capa 37. Rango sobre dataLliurament. Capa 36: incluye el día
            completo.
          schema: { type: string, format: date }
        - name: transportistaId
          in: query
          description: >-
            Repetible (tarea 22, 01/10/2026): varios valores = líneas de
            cualquiera de esos transportistas.
          style: form
          explode: true
          schema: { type: array, items: { type: integer } }
        - name: clientId
          in: query
          schema: { type: integer }
        - name: producte
          in: query
          description: >-
            Capa 37. Filtra por producte.descripcio — coincidencia EXACTA,
            case-insensitive (no substring), regla 3.1 transversal — mismo
            criterio que GET /panells/obrador, GET /panells/produccio y
            GET /rendiments-porcs. Repetible (29/09/2026), igual que en
            GET /panells/obrador: varios valores = líneas de cualquiera.
          style: form
          explode: true
          schema: { type: array, items: { type: string } }
        - name: categoriaId
          in: query
          description: >-
            Petición de Ari (29/09/2026). Categoría del artículo de la
            línea, mismo criterio que GET /panells/obrador.
          schema: { type: integer }
        - name: confirmacio
          in: query
          description: >-
            Petición de Ari (29/09/2026). "pendents" = líneas sin confirmar
            (confirmatA null); "confirmades" = ya enviadas. Sin el
            parámetro, todas. Otro valor = 400.
          schema: { type: string, enum: [pendents, confirmades] }
        - name: observacions
          in: query
          description: >-
            Tarea 23 (01/10/2026). Con / sin observación de empaquetado de
            la línea (obsEmpaquetat, tarea 7).
          schema: { type: string, enum: [si, 'no'] }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Panel con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: object
                    properties:
                      linies: { type: integer }
                      unitatsDemanades:
                        type: string
                        description: >-
                          Capa 38. BREAKING: string, no number (SUM de
                          NUMERIC(10,2)).
                      unitatsLliurades:
                        type: string
                        description: >-
                          Capa 38. BREAKING: mismo cambio que
                          unitatsDemanades.
                      kgDemanats: { type: string }
                      kgLliurats: { type: string }
                      liniesConfirmades: { type: integer }
                      liniesPendents: { type: integer }
                  dades:
                    type: array
                    items:
                      type: object
                      description: >-
                        FilaPanellEmpaquetatApi (@dpages/shared). Incluye
                        `categoria` (string, nullable) desde el 29/09/2026.
                  paginacio: { $ref: '#/components/schemas/Paginacio' }

  /api/v1/origens-comanda:
    get:
      tags: [OrigensComanda]
      summary: >-
        Listar orígenes de pedido (capa 43). Confirmado 18/08/2026 —
        reemplaza el enum fijo OrigenComanda.
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/OrigenComanda' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
