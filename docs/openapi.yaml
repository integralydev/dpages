  /api/v1/rols:
    get:
      tags: [Rols]
      summary: >-
        Listar roles (capa 17). Paginado desde la capa 46 — era la única
        ruta de listado sin paginacio.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Rol' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Rols]
      summary: Crear un rol
      description: >-
        Capa 39: restringido, sólo usuarios con "usuaris" en su
        modulsPermesos (403 SENSE_PERMIS si no) — mismo guard que ya usaba
        POST /usuaris. modulsPermesos se valida contra la lista cerrada de
        RolEntrada.modulsPermesos — cualquier valor fuera de ella rechaza
        con 400 VALIDACIO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '400': { $ref: '#/components/responses/Validacio' }
        '403': { $ref: '#/components/responses/SensePermis' }

  /api/v1/rols/moduls-valids:
    get:
      tags: [Rols]
      summary: >-
        Llistar els mòduls vàlids (capa 44). Mateixa constant que valida
        modulsPermesos a POST/PATCH /rols — sense guard, informació de
        referència. Pensat perquè el frontend deixi de mantenir la seva
        pròpia còpia hardcodejada (lib/roles.ts, MODULS_VALIDS).
      responses:
        '200':
          description: Llistat
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { type: string }
                    example:
                      - categories
                      - catalog
                      - tarifes
                      - tarifes-clients
                      - comandes
                      - rendiments-porcs
                      - panell-oficina
                      - panell-obrador
                      - panell-empaquetat
                      - panell-produccio
                      - usuaris
                      - rols
                      - transportistes

  /api/v1/rols/{id}:
    patch:
      tags: [Rols]
      summary: Actualizar un rol (parcial)
      description: >-
        Capa 39: restringido, mismo guard y misma validación de
        modulsPermesos que POST /rols.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rol' }
        '400': { $ref: '#/components/responses/Validacio' }
        '403': { $ref: '#/components/responses/SensePermis' }
        '404': { $ref: '#/components/responses/NoTrobat' }
    delete:
      tags: [Rols]
      summary: Eliminar un rol (capa 39, no existía antes)
      description: >-
        Restringido, mismo guard que POST/PATCH /rols. Borrado protegido —
        mismo criterio que DELETE /categories/{id}: si algún usuari tiene
        este rol asignado, 409 CONFLICTE (usuari.rolId es obligatorio, no
