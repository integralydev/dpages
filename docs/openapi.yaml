      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Eliminado }
        '403': { $ref: '#/components/responses/SensePermis' }
        '404': { $ref: '#/components/responses/NoTrobat' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/usuaris:
    get:
      tags: [Usuaris]
      summary: Listar usuarios (capa 17).
      parameters:
        - name: actiu
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Mida'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  dades:
                    type: array
                    items: { $ref: '#/components/schemas/Usuari' }
                  paginacio: { $ref: '#/components/schemas/Paginacio' }
    post:
      tags: [Usuaris]
      summary: >-
        Alta manual de un usuario, hecha por un Administrador (capa 19).
      description: >-
        Restringido: sólo usuarios con "usuaris" en su modulsPermesos
        (403 SENSE_PERMIS si no). El backend no envía ningún email — crea el
        usuario en Firebase Authentication (con una contraseña aleatoria
        descartable), crea la fila local, genera con el Admin SDK de
        Firebase un link de "establecé tu contraseña" de un solo uso
        (generatePasswordResetLink) y lo devuelve en linkEstabliment. Quien
        dio de alta a la persona comparte ese link a mano (WhatsApp, email
        personal, etc.) — no hay ningún otro mecanismo de entrega. Si algo
        falla después de crear el usuario en Firebase, se revierte
        (deleteUser) para no dejar un usuario huérfano allá.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuariCreacio' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuariCreatResposta' }
        '400': { $ref: '#/components/responses/Validacio' }
        '403': { $ref: '#/components/responses/SensePermis' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/usuaris/{id}:
    patch:
      tags: [Usuaris]
      summary: >-
        Actualizar un usuario (parcial) — sólo nom/rolId/actiu.
        firebaseUid y email son inmutables una vez creado.
      description: >-
        Capa 39: restringido, sólo usuarios con "usuaris" en su
        modulsPermesos (403 SENSE_PERMIS si no) — mismo guard que ya usaba
        POST /usuaris. Corrige un agujero de seguridad: cualquier usuario
        autenticado podía editar rolId de cualquiera, incluido el propio
        (auto-promoción a Administrador).
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuariEdicio' }
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuari' }
        '400': { $ref: '#/components/responses/Validacio' }
        '403': { $ref: '#/components/responses/SensePermis' }
        '404': { $ref: '#/components/responses/NoTrobat' }

  /api/v1/jo:
    get:
      tags: [Usuaris]
      summary: >-
        Usuario autenticado (resuelto por el uid del token de Firebase) con
        su rol y módulos permitidos. Lo primero que llama el frontend
        después de loguearse. Capa 17.
      description: >-
        Auto-provisioning: si es la primera vez que este uid llama a la
        API, se crea la fila de usuari en el momento, con rol "General"
        (decisión de negocio: "todos ven todo" salvo gestión de
        usuarios/roles, ver docs/contrato-api.md sección 4.12) y nom/email
        tomados de los claims del token. Nunca "Administrador" por esta vía
        — alguien ya-Administrador lo promueve a mano después, con PATCH
        /usuaris/{id}, o lo da de alta directo con ese rol vía POST
        /usuaris (capa 19). Si el usuario ya existe pero está desactivado
        (actiu=false), responde 403 SENSE_PERMIS.
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuari' }
        '403': { $ref: '#/components/responses/SensePermis' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: >
        Requerido en todas las rutas excepto /salut. En desarrollo local con
        AUTH_DISABLED=true no hace falta enviarlo.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, default: 1 }
    Mida:
      name: mida
      in: query
      schema: { type: integer, default: 50, maximum: 200 }

  responses:
    NoTrobat:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Validacio:
      description: Error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicte:
      description: Conflicto (p. ej. pedido congelado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SensePermis:
      description: 'Autenticado pero sin permiso (ej. usuari amb actiu=false)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    EstatComanda:
      type: string
      enum: [esborrany, oberta, en_proces, tancada, amb_incidencia, cancellada]

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codi:
              type: string
              enum: [VALIDACIO, NO_AUTENTICAT, SENSE_PERMIS, NO_TROBAT, CONFLICTE, ERROR_INTERN]
            missatge: { type: string }
            detalls:
              type: array
              items:
                type: object
                properties:
                  camp: { type: string }
                  missatge: { type: string }

    Paginacio:
      type: object
      properties:
        pagina: { type: integer }
        mida: { type: integer }
        total: { type: integer }
        totalPagines: { type: integer }

    Categoria:
      type: object
      properties:
        id: { type: integer }
        nom: { type: string }
        elaboratPorc: { type: boolean }
        agrupacioRendiment:
          type: string
          enum: [KG, MAGRE, PAQ]
          nullable: true
          description: >-
            Null sólo cuando elaboratPorc es false — regla de negocio, no
            falta de dato. Confirmado con el cliente el 18/08/2026.

    CategoriaEntrada:
      type: object
      description: >-
        Cuerpo de POST /categories (nom obligatorio) y PATCH /categories/{id}
        (cuerpo parcial). agrupacioRendiment sólo se acepta si elaboratPorc
        (el enviado, o si no viene, el actual) es true.
      properties:
        nom: { type: string }
        elaboratPorc: { type: boolean, default: false }
        agrupacioRendiment:
          type: string
          enum: [KG, MAGRE, PAQ]
          nullable: true

    Producte:
      type: object
      properties:
        id: { type: integer }
        codi: { type: string }
        descripcio: { type: string }
        descripcioVenda: { type: string }
        tipus: { type: string, enum: [simple, variable] }
        pesKg:
          type: string
          nullable: true
          description: 'Null = artículo «a medida»; el peso de línea queda editable'
        preuVenda: { type: string }
        actiu: { type: boolean }
        categoria:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        agrupacioProduccio:
          type: string
          nullable: true
          description: Texto libre. Agrupa varios códigos bajo una misma familia lógica de producción.
        format:
          type: string
          enum: [SENCER, TALLAT, LLESCAT]
          nullable: true
        envasat:
          type: string
          enum: ['NORMAL', 'NORMAL (pes)', 'NORMAL (web)', 'ESPECIAL']
          nullable: true

    ProducteEntrada:
      type: object
      properties:
        codi: { type: string }
        descripcio: { type: string }
        descripcioVenda: { type: string }
        tipus: { type: string, enum: [simple, variable] }
        pesKg: { type: string, nullable: true }
        preuVenda: { type: string }
        categoriaId: { type: integer }
        agrupacioProduccio: { type: string, nullable: true }
        format: { type: string, enum: [SENCER, TALLAT, LLESCAT], nullable: true }
        envasat:
          type: string
          enum: ['NORMAL', 'NORMAL (pes)', 'NORMAL (web)', 'ESPECIAL']
          nullable: true

    Tarifa:
      type: object
      description: Referencia mínima, usada dentro de client.tarifa, comanda.tarifa, etc.
      properties:
        id: { type: integer }
        nom: { type: string }

    TarifaResum:
      type: object
      description: Forma usada en la matriz de tarifas (GET /tarifes/matriu), con código propio.
      properties:
        id: { type: integer }
        codi: { type: string }
        nom: { type: string }

    TarifaEntrada:
      type: object
      required: [codi, nom]
      description: Cuerpo de POST /tarifes. codi es único — repetido responde 409.
      properties:
        codi: { type: string }
        nom: { type: string }

    Client:
      type: object
      properties:
        id: { type: integer }
        codi:
          type: string
          description: >-
            Nunca vacío, sin importar el origen. Siempre autogenerado
            ("CLI" + id, SIN ancho fijo — CLI45, CLI4916 — un padding fijo
            a 3 dígitos truncaba en vez de ensanchar con ids de 4+
            cifras): capa 25 para clientes del sync de WooCommerce, capa
            29 para alta manual (POST /clients) — mismo mecanismo para
            los dos. De sólo lectura para siempre: ningún endpoint lo
            acepta como entrada editable, ni al crear ni en
            PATCH /clients/{id} después.
        nom: { type: string }
        nif: { type: string, nullable: true }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        poblacio: { type: string, nullable: true }
        tarifa:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        transportistaDefecte:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
        actiu: { type: boolean }

    ClientEntrada:
      type: object
      required: [nom, poblacio]
      description: >-
        Mínimo confirmado por el prototipo. El resto son opcionales. codi
        NO va acá (capa 29) — se autogenera siempre, igual que ya hacía el
        sync de WooCommerce desde la capa 25; si se manda igual, se ignora.
      properties:
        nom: { type: string }
        poblacio: { type: string }
        tarifaId: { type: integer, nullable: true }
        email: { type: string, nullable: true }
        telefon: { type: string, nullable: true }
        nif: { type: string, nullable: true }

    Transportista:
      type: object
      properties:
        id: { type: integer }
        codi:
          type: string
          nullable: true
          description: 'Texto libre, nemotécnico, definido por el usuario al dar de alta — ej. "TR-DHL".'
        nom: { type: string }
        actiu: { type: boolean }

    TransportistaEntrada:
      type: object
      description: >-
        Cuerpo de POST /transportistes (nom obligatorio) y PATCH
        /transportistes/{id} (cuerpo parcial). codi es opcional pero único
        cuando se manda — repetido responde 409.
      properties:
        nom: { type: string }
        codi: { type: string, nullable: true }

    ComandaResum:
      type: object
      description: >-
        Forma usada en GET /comandes. (Corrección capa 35: GET
        /panells/oficina usa FilaPanellOficina, una forma distinta — no
        ComandaResum, como decía antes esta descripción.)
      properties:
        id: { type: integer }
        num: { type: string }
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "woocommerce", "manual") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
        estat: { $ref: '#/components/schemas/EstatComanda' }
        client:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }
            poblacio: { type: string }
        tarifa:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        transportista:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        poblacioDesti: { type: string, nullable: true }
        dataComanda: { type: string, format: date-time }
        dataProduccio: { type: string, format: date-time, nullable: true }
        datesProduccioLinies:
          type: array
          items: { type: string, format: date-time }
          description: >-
            Capa 21. Fechas de producción DISTINTAS entre las líneas del
            pedido (ComandaLinia.dataProduccio), ordenadas
            cronológicamente, sin nulls. Array vacío (nunca null) si
            ninguna línea tiene fecha de producción. Distinto de
            dataProduccio (arriba, a nivel de cabecera).
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        totalLinies: { type: integer }
        totalKg: { type: string }
        totalEur: { type: string }
        congelada: { type: boolean }
        totalIncidencies:
          type: integer
          description: Cantidad de incidencias asociadas al pedido
        tipusIncidencia:
          type: string
          nullable: true
          description: Null si hay más de un tipo de incidencia mezclado

    ComandaLinia:
      type: object
      properties:
        id: { type: integer }
        ordinal: { type: integer }
        producte:
          type: object
          nullable: true
          description: Null si el artículo no se pudo resolver (ver incidencies)
          properties:
            id: { type: integer }
            codi: { type: string }
            descripcio: { type: string }
        categoria:
          type: string
          nullable: true
          description: >-
            Capa 20 — mismo campo que FilaPanellObrador para esta misma
            línea (GET /panells/obrador), resuelto igual. Null si producte
            también es null, o si el artículo no tiene categoria asignada.
        format:
          type: string
          nullable: true
          description: Capa 20 — igual que FilaPanellObrador.format.
        envasat:
          type: string
          nullable: true
          description: Capa 20 — igual que FilaPanellObrador.envasat.
        unitatsDemanades:
          type: string
          description: >-
            Capa 38. BREAKING: string, no number (comanda_linia.
            unitats_demanades es NUMERIC(10,2) desde esta capa — entregas/
            pedidos parciales de pieza). El body de entrada de los 4 puntos
            que escriben este campo sigue aceptando un JS number normal.
        kgDemanats: { type: string }
        kgEditable:
          type: boolean
          description: Calculado por el backend según si el artículo tiene pesKg
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: Fecha de producción propia de la línea, distinta de la del pedido
        obsProduccio:
          type: string
          nullable: true
          description: Observación de producción propia de la línea
        unitatsLliurades:
          type: string
          description: >-
            Capa 38. BREAKING: mismo cambio que unitatsDemanades.
        kgLliurats: { type: string }
        confirmatA: { type: string, format: date-time, nullable: true }
        preuUnitari:
          type: string
          description: >-
            Cascada de resolución: 1) tarifa asignada al cliente para este
            producto; 2) si no hay, el precio base del producto
            (Producte.preuVenda); 3) si tampoco hay, "0.00" con incidencia
            registrada.
        totalLinia: { type: string }
        esborrat:
          type: boolean
          description: >-
            Siempre false en linies[] — una línea borrada (borrado lógico)
            nunca vuelve a aparecer aquí (capa 33). El campo queda por
            compatibilidad.

    Incidencia:
      type: object
      properties:
        tipus:
          type: string
          example: article_no_resolt
        detall: { type: string }
        creatA: { type: string, format: date-time }

    ComandaDetall:
      type: object
      description: Forma usada en GET /comandes/:id y POST /comandes
      properties:
        id: { type: integer }
        num: { type: string }
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "woocommerce", "manual") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
        estat: { $ref: '#/components/schemas/EstatComanda' }
        client:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string }, poblacio: { type: string } }
        tarifa:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        transportista:
          type: object
          nullable: true
          properties: { id: { type: integer }, nom: { type: string } }
        poblacioDesti: { type: string, nullable: true }
        adrecaLliurament:
          type: string
          nullable: true
          description: Dirección de entrega, distinta de la población de destino
        dataComanda: { type: string, format: date-time }
        dataProduccio: { type: string, format: date-time, nullable: true }
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        obsProduccio: { type: string, nullable: true }
        obsLliurament: { type: string, nullable: true }
        totalKg: { type: string }
        totalEur: { type: string }
        congelada: { type: boolean }
        congelatA: { type: string, format: date-time, nullable: true }
        linies:
          type: array
          items: { $ref: '#/components/schemas/ComandaLinia' }
        incidencies:
          type: array
          items: { $ref: '#/components/schemas/Incidencia' }

    ComandaEntrada:
      type: object
      required: [origen, clientId, linies]
      properties:
        origen:
          type: string
          description: >-
            Codi de origen_comanda (ej. "telefon", "whatsapp") — ya no es
            un enum fijo, ver el schema OrigenComanda y GET /origens-comanda.
            "woocommerce" no se puede elegir a mano (tarea 11): 400.
            Sólo lo asigna la sincronización.
        clientId: { type: integer }
        tarifaId:
          type: integer
          description: >-
            Capa 32. Opcional — si viene, anula la tarifa del cliente SÓLO
            para resolver el precio de las líneas de esta alta, y se guarda
            en comanda.tarifaId. Si no viene, se usa client.tarifaId (sin
            cambios respecto al comportamiento anterior a esta capa).
            Editarlo después vía PATCH /comandes/{id} no recalcula estas
            líneas, y POST /comandes/{comandaId}/linies (capa 30) nunca lo
            consulta — siempre usa la tarifa del cliente.
        dataLliurament: { type: string, format: date-time, nullable: true }
        transportistaId: { type: integer, nullable: true }
        obsLliurament: { type: string, nullable: true }
        linies:
          type: array
          items: { $ref: '#/components/schemas/LiniaEntrada' }

    LiniaEntrada:
      type: object
      description: >-
        Una línea nueva — usada tanto embebida en ComandaEntrada (alta
        completa) como en el body de POST /comandes/{comandaId}/linies
        (capa 30, agregar línea a un pedido ya existente). Mismo shape en
        los dos casos.
      required: [producteId, unitatsDemanades]
      properties:
        producteId: { type: integer }
        unitatsDemanades:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          description: >-
            Capa 38. JS number normal en la entrada, hasta 2 decimales
            (NUMERIC(10,2), entregas/pedidos parciales de pieza) — más de 2
            decimales rechaza con 400 VALIDACIO.
        kgDemanats:
          type: string
          nullable: true
          description: Sólo si el artículo es «a medida» (sin pesKg)
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: >-
            Capa 34. Opcional. Se valida contra las 6 reglas de coherencia
            temporal (ComandaEntradaParcial.dataProduccio) — en la alta
            (ComandaEntrada) sólo contra dataLliurament, la única fecha de
            cabecera que existe en ese body; en
            POST /comandes/{comandaId}/linies contra las 3 fechas de
            cabecera ya guardadas del pedido.

    ComandaEntradaParcial:
      type: object
      properties:
        tarifaId: { type: integer, nullable: true }
        transportistaId: { type: integer, nullable: true }
        poblacioDesti: { type: string, nullable: true }
        adrecaLliurament: { type: string, nullable: true }
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: >-
            Capa 34. Si cambia cualquiera de dataProduccio/dataExpedicio/
            dataLliurament, se valida el estado resultante (valor nuevo si
            vino, si no el ya guardado) contra las 6 reglas de coherencia
            temporal (ver docs/contrato-api.md § 4.5) — no sólo contra las
            otras 2 fechas de cabecera (reglas 1/2/3), sino también contra
            TODAS las líneas activas del pedido (reglas 4/5/6), aunque
            ninguna se esté tocando en este mismo request.
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos: { type: integer, nullable: true }
        obsProduccio: { type: string, nullable: true }
        obsLliurament: { type: string, nullable: true }
        estat:
          allOf: [{ $ref: '#/components/schemas/EstatComanda' }]
          description: >-
            Capa 31. Transición libre entre los 6 estados, sin máquina de
            estados. "cancellada" saca el pedido de todos los paneles. Si el valor es "amb_incidencia", `detall` es obligatorio
            en el mismo body y se registra como una incidencia nueva
            (tipus "manual") — a diferencia de las incidencias automáticas
            (sense_preu, etc.), ésta la dispara un usuario a mano.
        detall:
          type: string
          nullable: true
          description: >-
            Sólo se usa (y es obligatorio) cuando estat = "amb_incidencia".
            Se ignora en cualquier otro caso.

    FilaPanellOficina:
      type: object
      description: >-
        Capa 35 — forma real de GET /panells/oficina (dades[]). Antes el
        path referenciaba por error el schema ComandaResum (forma usada en
        GET /comandes), que no coincide: campos planos en vez de anidados
        (client como string, no objeto), sin bultos ni obsProduccio/
        obsLliurament. Se corrige acá.
      properties:
        comandaId: { type: integer }
        num: { type: string }
        client: { type: string, nullable: true }
        poblacioDesti: { type: string, nullable: true }
        tarifa: { type: string, nullable: true }
        transportista: { type: string, nullable: true }
        estat: { $ref: '#/components/schemas/EstatComanda' }
        dataComanda: { type: string, format: date-time }
        dataExpedicio: { type: string, format: date-time, nullable: true }
        dataLliurament: { type: string, format: date-time, nullable: true }
        bultos:
          type: integer
          nullable: true
          description: Capa 35.
        linies: { type: integer }
        totalKg: { type: string }
        totalEur: { type: string }
        obsProduccio:
          type: boolean
          description: >-
            Capa 35 — BREAKING: antes era el texto de comanda.obsProduccio
            (string | null); ahora es un booleano para el checkbox del
            panel, true si la cabecera tiene contenido O alguna línea activa
            (no esborrada) tiene su propio obsProduccio.
        obsLliurament:
          type: string
          nullable: true
          description: >-
            Sin cambios (capa 35) — sigue siendo el texto de
            comanda.obsLliurament. comanda_linia no tiene una columna
            obsLliurament propia.
        totalIncidencies: { type: integer }
        tipusIncidencia: { type: string, nullable: true }

    TreballLiniaResposta:
      type: object
      description: >-
        Capa 40. Respuesta de PATCH /comandes/{comandaId}/linies/{liniaId}/
        treball — siempre releída de la base.
      properties:
        liniaId: { type: integer }
        comandaId: { type: integer }
        treballatA: { type: string, format: date-time, nullable: true }
        treballatPer:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            nom: { type: string }

    FilaPanellObrador:
      type: object
      description: >-
        Confirmado con el cliente el 18/08/2026: una fila por LÍNEA de
        pedido individual, ya no agrupado por producto.
      properties:
        liniaId: { type: integer }
        comandaId: { type: integer }
        producte:
          type: object
          properties:
            id: { type: integer }
            codi: { type: string, nullable: true }
            descripcio: { type: string }
        categoria: { type: string, nullable: true }
        format: { type: string, nullable: true }
        envasat: { type: string, nullable: true }
        client: { type: string, nullable: true }
        dataProduccio:
          type: string
          format: date-time
          nullable: true
          description: Fecha de producción propia de la línea.
        unitats:
          type: string
          description: >-
            Capa 38. BREAKING: string, no number (comanda_linia.
            unitats_demanades es NUMERIC(10,2) desde esta capa).
        kg: { type: string }
        obsProduccio: { type: string, nullable: true }
        treballatA:
          type: string
          format: date-time
          nullable: true
          description: >-
            Capa 40. Null si nadie marcó la línea como trabajada (o se
            desmarcó). Ver PATCH /comandes/{comandaId}/linies/{liniaId}/treball.
        treballatPer:
          type: object
          nullable: true
          description: >-
            Capa 40. A diferencia de LliuramentResposta.confirmatPer (texto
            plano, uid de Firebase), esto es un FK real a usuari — se
            resuelve a {id, nom} de verdad.
          properties:
            id: { type: integer }
            nom: { type: string }

    RendimentPorc:
      type: object
      description: >-
        Ficha de rendimiento por producto — base del cálculo de Panell
        Producció. Nueva, confirmada el 18/08/2026. Sólo aparece si el
        producto pertenece a una categoría con agrupacioRendiment definido
        (ver GET /rendiments-porcs). BREAKING (capa 22): ya no trae
        producte en la respuesta — Francesc lo sacó de la pantalla.
        producteId sigue existiendo como campo de ENTRADA de
        RendimentPorcEntrada (el alta/edición sigue necesitando elegir el
        producto).
      properties:
        id: { type: integer }
        agrupacioRendiment:
          type: string
          description: Derivado de producte.categoria.agrupacioRendiment — sólo lectura.
        categoria:
          type: string
          description: Derivado de producte.categoria.nom — sólo lectura.
        agrupacioProduccio:
          type: string
          nullable: true
          description: Derivado de producte.agrupacioProduccio — sólo lectura.
        unitatsPerPorc: { type: string, example: '2.00' }
        kgPerUnitat: { type: string, example: '3.500' }
        pesTotal:
          type: string
          example: '7.000'
          description: Calculado = unitatsPerPorc × kgPerUnitat.

    RendimentPorcEntrada:
      type: object
      required: [producteId, unitatsPerPorc, kgPerUnitat]
      description: >-
        unitatsPerPorc admite hasta 2 decimales, kgPerUnitat hasta 3 (mismas
        escalas que la columna en base).
      properties:
        producteId: { type: integer }
        unitatsPerPorc: { type: string, example: '2.00' }
        kgPerUnitat: { type: string, example: '3.500' }

    OrigenComanda:
      type: object
      description: >-
        Entidad de origen_comanda (confirmado 18/08/2026: tabla mantenible,
        ya no un enum fijo). codi es el valor de ComandaResum.origen /
        ComandaDetall.origen.
      properties:
        id: { type: integer }
        codi: { type: string, example: woocommerce }
        nom: { type: string, example: WooCommerce }
        actiu: { type: boolean }

    OrigenComandaEntrada:
      type: object
      required: [codi, nom]
      properties:
        codi:
          type: string
          description: Estable una vez creado — no se edita por PATCH.
        nom: { type: string }
        actiu: { type: boolean, default: true }

    PanellProduccioFila:
      type: object
      description: >-
        Una fila por agrupacioProduccio (capa 16) — ver docs/contrato-api.md
        sección 4.10 para las fórmulas y el ejemplo numérico verificado.
        BREAKING (capa 22): ya no trae producte — una agrupación de
        producción puede tener varios artículos asociados; mostrar sólo
        uno (el de id más chico) confundía más de lo que ayudaba con datos
        reales. El filtro ?producte= de GET /panells/produccio no cambia,
        esto sólo afecta la respuesta.
      properties:
        agrupacioRendiment: { type: string, enum: [KG, MAGRE, PAQ] }
        categoria: { type: string }
        agrupacioProduccio: { type: string }
        paqPedido:
          type: string
          nullable: true
          description: Null cuando agrupacioRendiment es KG o MAGRE (no aplica).
        kgAElaborar:
          type: string
          nullable: true
          description: Null cuando agrupacioRendiment es PAQ.
        rendiment:
          type: string
          nullable: true
          description: Null en filas MAGRE — van al total global, no por línea.
        diferencia:
          type: string
          nullable: true
          description: Mismo criterio que rendiment.

    PanellProduccio:
      type: object
      properties:
        totals:
          type: object
          properties:
            totalKgAElaborar: { type: string }
            totalKgMagro: { type: string }
            diferencia: { type: string }
            kgJamon:
              type: string
              description: >-
                Capa 24. Rendimiento fijo por cerdo confirmado por
                Francesc (12 kg/cerdo) — constante de negocio, NO
                calculada desde Rendiments Porcs: constante × nombrePorcs.
                Nunca null (nombrePorcs ya es obligatorio en este
                endpoint).
            kgRecortes:
              type: string
              description: Igual que kgJamon — 6 kg/cerdo (Francesc).
            kgPaletillas:
              type: string
              description: Igual que kgJamon — 7 kg/cerdo (Francesc).
        dades:
          type: array
          items: { $ref: '#/components/schemas/PanellProduccioFila' }
        paginacio: { $ref: '#/components/schemas/Paginacio' }

    Rol:
      type: object
      description: >-
        Define qué módulos ve el usuario en el frontend. Capa 17. Hoy
        existen "Administrador" (todos los módulos) y "General" (todos
        salvo "usuaris"/"rols"). ADR-021: hasta la capa 19 ningún endpoint
        de negocio restringía por rol — POST /usuaris (capa 19) fue la
        primera excepción, exige "usuaris" en modulsPermesos. Capa 39:
        PATCH /usuaris/{id} y POST/PATCH/DELETE /rols exigen ahora el mismo
        módulo (agujero de seguridad corregido — auto-promoción a
        Administrador). Parametrizable sin desarrollo si algún día hace
        falta más granularidad.
      properties:
        id: { type: integer }
        nom: { type: string }
        modulsPermesos:
          type: array
          items: { type: string }
          example:
            [
              categories,
              catalog,
              tarifes,
              tarifes-clients,
              comandes,
              rendiments-porcs,
              panell-oficina,
              panell-obrador,
              panell-empaquetat,
              panell-produccio,
              usuaris,
              rols,
            ]

    RolEntrada:
      type: object
      required: [nom, modulsPermesos]
      properties:
        nom: { type: string }
        modulsPermesos:
          type: array
          description: >-
            Capa 39: validado contra una lista cerrada — cualquier valor
            fuera de ella rechaza con 400 VALIDACIO (con el/los valor(es)
            inválido(s) en el detalle del error).
          items:
            type: string
            enum:
              - categories
              - catalog
              - tarifes
              - tarifes-clients
              - comandes
              - rendiments-porcs
              - panell-oficina
              - panell-obrador
              - panell-empaquetat
              - panell-produccio
              - usuaris
              - rols

    Usuari:
      type: object
      description: >-
        Capa 17. Se crea por auto-provisioning (GET /jo y cualquier otro
        endpoint de negocio) o por alta manual de un Administrador
        (POST /usuaris, capa 19).
      properties:
        id: { type: integer }
        firebaseUid:
          type: string
          description: uid de Firebase Auth — vínculo con el token, ver ADR-021.
        nom: { type: string }
        email: { type: string }
        rol:
          type: object
          description: >-
            Incluye modulsPermesos acá (no sólo en el schema Rol) porque
            GET /jo es lo primero que llama el frontend y necesita saberlo
            sin una segunda llamada a GET /rols/{id}.
          properties:
            id: { type: integer }
            nom: { type: string }
            modulsPermesos:
              type: array
              items: { type: string }
        actiu: { type: boolean }

    UsuariCreacio:
      type: object
      description: >-
        Cuerpo de POST /usuaris (capa 19). A diferencia del auto-
        provisioning, no lleva firebaseUid: lo genera el backend al crear
        el usuario en Firebase, no lo elige quien da de alta.
      required: [nom, email, rolId]
      properties:
        nom: { type: string }
        email: { type: string }
        rolId: { type: integer }

    UsuariCreatResposta:
      type: object
      description: >-
        Respuesta de POST /usuaris (capa 19). No hay envío de email — el
        Administrador comparte linkEstabliment a mano por el canal que use.
      properties:
        usuari: { $ref: '#/components/schemas/Usuari' }
        linkEstabliment:
          type: string
          description: >-
            Link de Firebase (generatePasswordResetLink) de un solo uso
            para que la persona establezca su propia contraseña. Nunca debe
            loggearse ni guardarse más allá de esta respuesta.

    UsuariEdicio:
      type: object
      description: >-
        Cuerpo de PATCH /usuaris/{id} — sólo los campos editables.
        firebaseUid y email son inmutables, no están acá a propósito.
      properties:
        nom: { type: string }
        rolId: { type: integer }
        actiu: { type: boolean }
