        '403': { $ref: '#/components/responses/SensePermis' }
        '409': { $ref: '#/components/responses/Conflicte' }

  /api/v1/origens-comanda/{id}:
    patch:
      tags: [OrigensComanda]
      summary: >-
        Actualizar un origen de pedido (parcial — codi no se edita). Exige
